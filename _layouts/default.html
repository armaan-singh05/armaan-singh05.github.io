<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description | strip_html | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a>
      <nav>
        <a href="{{ '/#projects' | relative_url }}">Projects</a>
        <a href="{{ '/#experience' | relative_url }}">Experience</a>
        <a href="{{ '/#contact' | relative_url }}">Contact</a>
        <a class="nav-cta" href="{{ site.data.profile.resume | relative_url }}" target="_blank" rel="noopener">Resume</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="footer">
    <div class="container">
      © {{ 'now' | date: '%Y' }} {{ site.data.profile.name }}
    </div>
  </footer>
</body>
</html>
